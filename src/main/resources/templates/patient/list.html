<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Management</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="navbar">
    <a class="logo" href="/home/admin">🏥 HealthCare <span>Management System</span></a>
    <nav>
        <a href="/home/admin"><span>🏠</span> Home</a>
        <a href="/patients" class="active"><span>👤</span> Patients</a>
        <a href="/doctors"><span>🩺</span> Doctors</a>
        <a href="/appointments"><span>📅</span> Appointments</a>
        <a href="/scheduling"><span>🗓️</span> Scheduling</a>
        <a href="/feedback"><span>💬</span> Feedback</a>
        <a href="/admin"><span>⚙️</span> Admin</a>
        <a href="/admin/requests"><span>🔔</span> Requests</a>
        <a href="/logout" class="logout-btn"><span>🚪</span> Logout</a>
    </nav>
</div>
<div class="main-content">
    <div class="page-header">
        <div>
            <h1>Patient Management</h1>
            <p>Manage all registered patients</p>
        </div>
        <a href="/patients/add" class="btn btn-primary">+ Add New Patient</a>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Status</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}">
                <td><span class="badge badge-blue" th:text="${patient.id}"></span></td>
                <td th:text="${patient.name}"></td>
                <td th:text="${patient.age}"></td>
                <td><span class="badge badge-green" th:text="${patient.gender}"></span></td>
                <td th:text="${patient.phone}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${patient.status == 'Approved'} ? 'badge-green' : (${patient.status == 'Pending'} ? 'badge-orange' : 'badge-red')"
                              th:text="${patient.status}"></span>
                </td>
                <td>
                    <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning" style="padding:6px 14px; font-size:12px;">Edit</a>
                    <a th:href="@{/patients/delete/{id}(id=${patient.id})}" class="btn btn-danger" style="padding:6px 14px; font-size:12px;" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
