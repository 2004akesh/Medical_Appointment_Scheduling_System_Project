<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Admin</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="navbar">
  <a class="logo" href="/home/admin">🏥 HealthCare <span>Management System</span></a>
  <nav>
    <a href="/home/admin"><span>🏠</span> Home</a>
    <a href="/patients"><span>👤</span> Patients</a>
    <a href="/doctors"><span>🩺</span> Doctors</a>
    <a href="/appointments"><span>📅</span> Appointments</a>
    <a href="/scheduling"><span>🗓️</span> Scheduling</a>
    <a href="/feedback"><span>💬</span> Feedback</a>
    <a href="/admin" class="active"><span>⚙️</span> Admin</a>
    <a href="/admin/requests"><span>🔔</span> Requests</a>
    <a href="/logout" class="logout-btn"><span>🚪</span> Logout</a>
  </nav>
</div>
<div class="main-content">
  <div class="page-header">
    <div><h1>Edit Admin</h1><p>Update admin details</p></div>
    <a href="/admin" class="btn btn-primary">← Back to List</a>
  </div>
  <div class="card" style="max-width: 600px;">
    <form th:action="@{/admin/edit/{id}(id=${admin.id})}" th:object="${admin}" method="post">
      <div class="form-group"><label>Full Name</label><input type="text" th:field="*{name}" required/></div>
      <div class="form-group"><label>Phone</label><input type="text" th:field="*{phone}" required/></div>
      <div class="form-group"><label>Username</label><input type="text" th:field="*{username}" required/></div>
      <div class="form-group"><label>Password</label><input type="password" th:field="*{password}" required/></div>
      <div class="form-group">
        <label>Role</label>
        <select th:field="*{role}">
          <option value="Super Admin">Super Admin</option>
          <option value="Admin">Admin</option>
          <option value="Moderator">Moderator</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success">Update Admin</button>
      <a href="/admin" class="btn btn-danger" style="margin-left:10px;">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
