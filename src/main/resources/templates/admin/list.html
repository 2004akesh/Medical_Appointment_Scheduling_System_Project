<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Management</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="navbar">
    <a class="logo" href="/home/admin">🏥 HealthCare <span>Management System</span></a>
    <nav>
        <a href="/home/admin"><span>🏠</span> Home</a>
        <a href="/patients"><span>👤</span> Patients</a>
        <a href="/doctors"><span>🩺</span> Doctors</a>
        <a href="/appointments"><span>📅</span> Appointments</a>
        <a href="/scheduling"><span>🗓️</span> Scheduling</a>
        <a href="/feedback"><span>💬</span> Feedback</a>
        <a href="/admin" class="active"><span>⚙️</span> Admin</a>
        <a href="/admin/requests"><span>🔔</span> Requests</a>
        <a href="/logout" class="logout-btn"><span>🚪</span> Logout</a>
    </nav>
</div>
<div class="main-content">
    <div class="page-header">
        <div><h1>Admin Management</h1><p>Manage system administrators</p></div>
        <a href="/admin/add" class="btn btn-primary">+ Add Admin</a>
    </div>
    <!-- STATS BAR -->
    <div style="display: flex; gap: 20px; margin-bottom: 25px;">
        <div style="background:white; border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
            <h3 style="font-size:24px; color:#1976d2; font-weight:800;"
                th:text="${#lists.size(admins)}">0</h3>
            <p style="color:#888; font-size:12px; margin-top:4px;">Total Admins</p>
        </div>
        <div style="background:white; border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
            <h3 style="font-size:24px; color:#2e7d32; font-weight:800;"
                th:text="${pendingDoctors}">0</h3>
            <p style="color:#888; font-size:12px; margin-top:4px;">Pending Doctors</p>
        </div>
        <div style="background:white; border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
            <h3 style="font-size:24px; color:#e65100; font-weight:800;"
                th:text="${pendingPatients}">0</h3>
            <p style="color:#888; font-size:12px; margin-top:4px;">Pending Patients</p>
        </div>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Username</th><th>Role</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${admins}">
                <td><span class="badge badge-blue" th:text="${a.id}"></span></td>
                <td th:text="${a.name}"></td>
                <td th:text="${a.phone}"></td>
                <td th:text="${a.username}"></td>
                <td><span class="badge badge-green" th:text="${a.role}"></span></td>
                <td>
                    <a th:href="@{/admin/edit/{id}(id=${a.id})}" class="btn btn-warning" style="padding:6px 14px; font-size:12px;">Edit</a>
                    <a th:href="@{/admin/delete/{id}(id=${a.id})}" class="btn btn-danger" style="padding:6px 14px; font-size:12px;" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
