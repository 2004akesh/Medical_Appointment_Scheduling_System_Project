<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Submitted</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0a2342, #1976d2); }
        .box { background: white; padding: 50px 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 420px; animation: fadeIn 0.5s ease; }
        .box h1 { color: #2e7d32; font-size: 60px; margin-bottom: 10px; }
        .box h2 { color: #0a2342; margin-bottom: 10px; }
        .box p { color: #666; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>
<div class="box">
    <h1>✅</h1>
    <h2>Registration Submitted!</h2>
    <p th:text="${message}"></p>
    <a href="/login" class="btn btn-primary">Go to Login</a>
</div>
</body>
</html>
