<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Sign Up</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1b5e20, #2e7d32); }
        .signup-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 450px; animation: fadeIn 0.5s ease; }
        .signup-box h1 { color: #2e7d32; margin-bottom: 5px; font-size: 24px; text-align: center; }
        .signup-box p { color: #888; margin-bottom: 25px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
<div class="signup-box">
    <h1>🩺 Doctor Sign Up</h1>
    <p>Fill in your details. Admin will review your request.</p>
    <form th:action="@{/signup/doctor}" th:object="${doctor}" method="post">
        <div class="form-group">
            <label>Full Name (used as username)</label>
            <input type="text" th:field="*{name}" placeholder="Enter your full name" required/>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" th:field="*{phone}" placeholder="Enter phone number" required/>
        </div>
        <div class="form-group">
            <label>Specialization</label>
            <select th:field="*{specialization}">
                <option value="Cardiologist">Cardiologist</option>
                <option value="Dermatologist">Dermatologist</option>
                <option value="Neurologist">Neurologist</option>
                <option value="Pediatrician">Pediatrician</option>
                <option value="Surgeon">Surgeon</option>
                <option value="General Practitioner">General Practitioner</option>
            </select>
        </div>
        <div class="form-group">
            <label>Availability</label>
            <select th:field="*{availability}">
                <option value="Monday - Friday">Monday - Friday</option>
                <option value="Monday - Saturday">Monday - Saturday</option>
                <option value="Weekends Only">Weekends Only</option>
                <option value="On Call">On Call</option>
            </select>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Create a password" required/>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Submit Registration</button>
        <br/><br/>
        <a href="/login" style="display:block; text-align:center; color:#888; font-size:13px;">← Back to Login</a>
    </form>
</div>
</body>
</html>
