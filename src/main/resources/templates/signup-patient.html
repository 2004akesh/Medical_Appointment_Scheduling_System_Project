<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Sign Up</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0a2342, #1976d2); }
        .signup-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 450px; animation: fadeIn 0.5s ease; }
        .signup-box h1 { color: #0a2342; margin-bottom: 5px; font-size: 24px; text-align: center; }
        .signup-box p { color: #888; margin-bottom: 25px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
<div class="signup-box">
    <h1>👤 Patient Sign Up</h1>
    <p>Fill in your details. Admin will review your request.</p>
    <form th:action="@{/signup/patient}" th:object="${patient}" method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter your full name" required/>
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" th:field="*{age}" placeholder="Enter your age" required/>
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select th:field="*{gender}">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="form-group">
            <label>Phone Number (used as username)</label>
            <input type="text" th:field="*{phone}" placeholder="Enter phone number" required/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Create a password" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Registration</button>
        <br/><br/>
        <a href="/login" style="display:block; text-align:center; color:#888; font-size:13px;">← Back to Login</a>
    </form>
</div>
</body>
</html>
