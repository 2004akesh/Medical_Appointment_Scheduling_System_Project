<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Add Feedback</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <style>
        .rating-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rating-option { flex: 1; min-width: 80px; }
        .rating-option input[type="radio"] { display: none; }
        .rating-option label {
            display: block;
            text-align: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .rating-option input[type="radio"]:checked + label {
            border-color: #1976d2;
            background: #e3f2fd;
            color: #1976d2;
        }
        .rating-option label:hover {
            border-color: #1976d2;
            background: #f5f9ff;
        }
    </style>
</head>
<body>
<div class="navbar">
    <a class="logo" href="#">🏥 HealthCare <span>Management System</span></a>
    <nav>
        <th:block th:if="${session.userRole == 'ADMIN'}">
            <a href="/home/admin">🏠 Home</a>
            <a href="/patients">👤 Patients</a>
            <a href="/doctors">🩺 Doctors</a>
            <a href="/appointments">📅 Appointments</a>
            <a href="/scheduling">🗓️ Scheduling</a>
            <a href="/feedback" class="active">💬 Feedback</a>
            <a href="/admin">⚙️ Admin</a>
            <a href="/admin/requests">🔔 Requests</a>
        </th:block>
        <th:block th:if="${session.userRole == 'PATIENT'}">
            <a href="/home/patient">🏠 Home</a>
            <a href="/feedback" class="active">💬 Feedback</a>
        </th:block>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </nav>
</div>

<div class="main-content">
    <div class="page-header">
        <div>
            <h1>💬 Add Feedback</h1>
            <p>Share your experience with us</p>
        </div>
        <a href="/feedback" class="btn btn-primary">← Back to List</a>
    </div>

    <div class="card" style="max-width: 650px;">
        <form th:action="@{/feedback/add}"
              th:object="${feedback}" method="post">

            <!-- Patient Name -->
            <div class="form-group">
                <label>Patient Name</label>
                <!-- Readonly for Patient -->
                <input th:if="${session.userRole == 'PATIENT'}"
                       type="text"
                       th:field="*{patientName}"
                       th:value="${session.loggedInUser}"
                       readonly
                       style="background:#f5f5f5; cursor:not-allowed;"
                       required/>
                <!-- Editable for Admin -->
                <input th:if="${session.userRole == 'ADMIN'}"
                       type="text"
                       th:field="*{patientName}"
                       placeholder="Enter patient name"
                       required/>
                <small th:if="${session.userRole == 'PATIENT'}"
                       style="color:#888; font-size:12px; margin-top:4px; display:block;">
                    ✅ Auto filled with your name
                </small>
            </div>

            <!-- Doctor Name Dropdown -->
            <div class="form-group">
                <label>Doctor Name</label>
                <select th:field="*{doctorName}" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="d : ${doctors}"
                            th:value="${d.name}"
                            th:text="'Dr. ' + ${d.name} + ' - ' + ${d.specialization}">
                    </option>
                </select>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label>Your Experience</label>
                <textarea th:field="*{message}"
                          placeholder="Share your experience in detail..."
                          rows="4"
                          style="width:100%; padding:12px 15px;
                                 border:2px solid #e0e0e0; border-radius:10px;
                                 font-size:14px; outline:none; resize:vertical;
                                 transition: border 0.3s ease; font-family: inherit;"
                          onfocus="this.style.borderColor='#1976d2'"
                          onblur="this.style.borderColor='#e0e0e0'"
                          required></textarea>
            </div>

            <!-- Rating -->
            <div class="form-group">
                <label>Rating</label>
                <div class="rating-group">
                    <div class="rating-option">
                        <input type="radio" th:field="*{rating}"
                               id="r5" value="5"/>
                        <label for="r5">⭐⭐⭐⭐⭐<br/>Excellent</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" th:field="*{rating}"
                               id="r4" value="4"/>
                        <label for="r4">⭐⭐⭐⭐<br/>Good</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" th:field="*{rating}"
                               id="r3" value="3"/>
                        <label for="r3">⭐⭐⭐<br/>Average</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" th:field="*{rating}"
                               id="r2" value="2"/>
                        <label for="r2">⭐⭐<br/>Poor</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" th:field="*{rating}"
                               id="r1" value="1"/>
                        <label for="r1">⭐<br/>Very Poor</label>
                    </div>
                </div>
            </div>

            <!-- Date -->
            <div class="form-group">
                <label>Date</label>
                <input type="date" th:field="*{date}" required/>
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button type="submit" class="btn btn-success"
                        style="flex:1; padding:13px;">
                    ✅ Submit Feedback
                </button>
                <a href="/feedback" class="btn btn-danger"
                   style="padding:13px 20px;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
