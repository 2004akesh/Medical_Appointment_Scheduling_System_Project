<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Feedback</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="navbar">
    <a class="logo" href="#">🏥 HealthCare <span>Management System</span></a>
    <nav>
        <th:block th:if="${session.userRole == 'ADMIN'}">
            <a href="/home/admin">🏠 Home</a>
            <a href="/patients">👤 Patients</a>
            <a href="/doctors">🩺 Doctors</a>
            <a href="/appointments">📅 Appointments</a>
            <a href="/scheduling">🗓️ Scheduling</a>
            <a href="/feedback" class="active">💬 Feedback</a>
            <a href="/admin">⚙️ Admin</a>
            <a href="/admin/requests">🔔 Requests</a>
        </th:block>
        <th:block th:if="${session.userRole == 'PATIENT'}">
            <a href="/home/patient">🏠 Home</a>
            <a href="/feedback" class="active">💬 Feedback</a>
        </th:block>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </nav>
</div>
<div class="main-content">
    <div class="page-header">
        <div>
            <h1>Add Feedback</h1>
            <p>Share your experience with us</p>
        </div>
        <a href="/feedback" class="btn btn-primary">← Back to List</a>
    </div>
    <div class="card" style="max-width: 600px;">
        <form th:action="@{/feedback/add}" th:object="${feedback}" method="post">
            <div class="form-group">
                <label>Patient Name</label>
                <!-- For PATIENT - auto filled, readonly -->
                <input th:if="${session.userRole == 'PATIENT'}"
                       type="text"
                       th:field="*{patientName}"
                       th:value="${session.loggedInUser}"
                       readonly
                       style="background:#f5f5f5; cursor:not-allowed;"
                       required/>

                <!-- For ADMIN - editable -->
                <input th:if="${session.userRole == 'ADMIN'}"
                       type="text"
                       th:field="*{patientName}"
                       placeholder="Enter patient name"
                       required/>
                <small th:if="${session.userRole == 'PATIENT'}"
                       style="color:#888; font-size:12px; margin-top:4px; display:block;">
                    ✅ Auto filled with your name
                </small>
            </div>
            <div class="form-group">
                <label>Doctor Name</label>
                <input type="text" th:field="*{doctorName}"
                       placeholder="Enter doctor name" required/>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea th:field="*{message}"
                          placeholder="Share your experience..."
                          rows="4"
                          style="width:100%; padding:11px 15px; border:2px solid #e0e0e0;
                          border-radius:8px; font-size:14px; outline:none;
                          transition: border 0.3s ease;"
                          required></textarea>
            </div>
            <div class="form-group">
                <label>Rating</label>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:80px;">
                        <input type="radio" th:field="*{rating}" id="r5" value="5"
                               style="display:none;"/>
                        <label for="r5"
                               style="display:block; text-align:center; padding:10px;
                          border:2px solid #e0e0e0; border-radius:10px;
                          cursor:pointer; font-size:13px; font-weight:600;
                          transition:all 0.3s ease;"
                               onmouseover="this.style.borderColor='#1976d2'; this.style.background='#f5f9ff'"
                               onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                            ⭐⭐⭐⭐⭐<br/>Excellent
                        </label>
                    </div>
                    <div style="flex:1; min-width:80px;">
                        <input type="radio" th:field="*{rating}" id="r4" value="4"
                               style="display:none;"/>
                        <label for="r4"
                               style="display:block; text-align:center; padding:10px;
                          border:2px solid #e0e0e0; border-radius:10px;
                          cursor:pointer; font-size:13px; font-weight:600;
                          transition:all 0.3s ease;"
                               onmouseover="this.style.borderColor='#1976d2'; this.style.background='#f5f9ff'"
                               onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                            ⭐⭐⭐⭐<br/>Good
                        </label>
                    </div>
                    <div style="flex:1; min-width:80px;">
                        <input type="radio" th:field="*{rating}" id="r3" value="3"
                               style="display:none;"/>
                        <label for="r3"
                               style="display:block; text-align:center; padding:10px;
                          border:2px solid #e0e0e0; border-radius:10px;
                          cursor:pointer; font-size:13px; font-weight:600;
                          transition:all 0.3s ease;"
                               onmouseover="this.style.borderColor='#1976d2'; this.style.background='#f5f9ff'"
                               onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                            ⭐⭐⭐<br/>Average
                        </label>
                    </div>
                    <div style="flex:1; min-width:80px;">
                        <input type="radio" th:field="*{rating}" id="r2" value="2"
                               style="display:none;"/>
                        <label for="r2"
                               style="display:block; text-align:center; padding:10px;
                          border:2px solid #e0e0e0; border-radius:10px;
                          cursor:pointer; font-size:13px; font-weight:600;
                          transition:all 0.3s ease;"
                               onmouseover="this.style.borderColor='#1976d2'; this.style.background='#f5f9ff'"
                               onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                            ⭐⭐<br/>Poor
                        </label>
                    </div>
                    <div style="flex:1; min-width:80px;">
                        <input type="radio" th:field="*{rating}" id="r1" value="1"
                               style="display:none;"/>
                        <label for="r1"
                               style="display:block; text-align:center; padding:10px;
                          border:2px solid #e0e0e0; border-radius:10px;
                          cursor:pointer; font-size:13px; font-weight:600;
                          transition:all 0.3s ease;"
                               onmouseover="this.style.borderColor='#1976d2'; this.style.background='#f5f9ff'"
                               onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                            ⭐<br/>Very Poor
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" th:field="*{date}" required/>
            </div>
            <button type="submit" class="btn btn-success">Submit Feedback</button>
            <a href="/feedback" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
