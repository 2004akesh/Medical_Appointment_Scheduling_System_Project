<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Feedback</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="navbar">
    <a class="logo" href="#">🏥 HealthCare <span>Management System</span></a>
    <nav>
        <th:block th:if="${session.userRole == 'ADMIN'}">
            <a href="/home/admin">🏠 Home</a>
            <a href="/patients">👤 Patients</a>
            <a href="/doctors">🩺 Doctors</a>
            <a href="/appointments">📅 Appointments</a>
            <a href="/scheduling">🗓️ Scheduling</a>
            <a href="/feedback" class="active">💬 Feedback</a>
            <a href="/admin">⚙️ Admin</a>
            <a href="/admin/requests">🔔 Requests</a>
        </th:block>
        <th:block th:if="${session.userRole == 'PATIENT'}">
            <a href="/home/patient">🏠 Home</a>
            <a href="/feedback" class="active">💬 Feedback</a>
        </th:block>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </nav>
</div>
<div class="main-content">
    <div class="page-header">
        <div>
            <h1>Edit Feedback</h1>
            <p>Update your feedback</p>
        </div>
        <a href="/feedback" class="btn btn-primary">← Back to List</a>
    </div>
    <div class="card" style="max-width: 600px;">
        <form th:action="@{/feedback/edit/{id}(id=${feedback.id})}"
              th:object="${feedback}" method="post">
            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" th:field="*{patientName}" required/>
            </div>
            <div class="form-group">
                <label>Doctor Name</label>
                <input type="text" th:field="*{doctorName}" required/>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea th:field="*{message}" rows="4"
                          style="width:100%; padding:11px 15px; border:2px solid #e0e0e0;
                          border-radius:8px; font-size:14px; outline:none;"
                          required></textarea>
            </div>
            <div class="form-group">
                <label>Rating</label>
                <select th:field="*{rating}">
                    <option value="5">⭐⭐⭐⭐⭐ Excellent (5)</option>
                    <option value="4">⭐⭐⭐⭐ Good (4)</option>
                    <option value="3">⭐⭐⭐ Average (3)</option>
                    <option value="2">⭐⭐ Poor (2)</option>
                    <option value="1">⭐ Very Poor (1)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" th:field="*{date}" required/>
            </div>
            <button type="submit" class="btn btn-success">Update Feedback</button>
            <a href="/feedback" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
